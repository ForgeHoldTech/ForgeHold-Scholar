<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeHold Scholar</title>
<style>
  :root {
    --paper: #f6f1e7;
    --card: #fffdf8;
    --ink: #1f1b16;
    --muted: #6b6256;
    --line: #d8cfbd;
    --accent: #7a1f1f;
    --accent-soft: #f1e2dc;
    --serif: Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.55; }
  header { border-bottom: 3px double var(--line); padding: 28px 16px 20px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  h1 { font-family: var(--serif); font-size: 2rem; margin: 0; letter-spacing: 0.01em; }
  .tagline { color: var(--muted); margin: 4px 0 16px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; font-family: var(--mono); font-size: 0.8rem; }
  .stat b { color: var(--accent); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; padding: 24px 16px 48px; max-width: 1080px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--card); border: 1px solid var(--line); padding: 18px; margin-bottom: 20px; }
  h2 { font-family: var(--serif); font-size: 1.1rem; margin: 0 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  textarea, select, input[type=text] { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  textarea { min-height: 84px; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; align-items: center; }
  .row > label { font-size: 0.9rem; }
  .filters { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
  button { font: inherit; cursor: pointer; }
  .ask { background: var(--accent); color: #fff; border: 0; padding: 10px 22px; font-weight: 600; }
  .ask:disabled { opacity: 0.55; cursor: wait; }
  .sample { background: none; border: 1px dashed var(--line); color: var(--muted); padding: 6px 10px; font-size: 0.82rem; text-align: left; }
  .sample:hover { border-color: var(--accent); color: var(--accent); }
  .answer { font-family: var(--serif); font-size: 1.05rem; white-space: pre-wrap; }
  .answer.refused { color: var(--accent); font-style: italic; }
  .cite { font-family: var(--mono); font-size: 0.8rem; background: var(--accent-soft); color: var(--accent); padding: 1px 4px; cursor: pointer; }
  .meta { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); margin-top: 12px; }
  .error { color: var(--accent); font-weight: 600; }
  .source { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin-bottom: 14px; opacity: 0.6; }
  .source.cited { border-left-color: var(--accent); opacity: 1; }
  .source h3 { font-family: var(--serif); font-size: 0.95rem; margin: 0; }
  .source p { font-size: 0.85rem; margin: 6px 0 0; }
  .step { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 0.85rem; }
  .step:last-child { border-bottom: 0; }
  .tool { font-family: var(--mono); color: var(--accent); font-weight: 600; }
  .step code { display: block; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere; margin-top: 4px; }
  .empty { color: var(--muted); font-size: 0.9rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>ForgeHold Scholar</h1>
    <p class="tagline">Cited answers over a private collection of research papers</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main>
  <section>
    <div class="card">
      <h2>Ask a question</h2>
      <textarea id="question" maxlength="500" placeholder="What do these papers say about dense retrieval?"></textarea>
      <div class="row">
        <label><input type="radio" name="mode" value="quick" checked> Quick answer</label>
        <label><input type="radio" name="mode" value="agent"> Agent (search, SQL, calculator)</label>
      </div>
      <div class="filters" id="filters">
        <select id="paper"><option value="">All papers</option></select>
        <input type="text" id="year" maxlength="4" placeholder="Year">
      </div>
      <div class="row">
        <button class="ask" id="ask">Ask</button>
        <span class="meta" id="progress"></span>
      </div>
      <div class="row" id="samples"></div>
    </div>

    <div class="card">
      <h2>Answer</h2>
      <div id="answer" class="empty">The answer will appear here with numbered citations.</div>
      <div class="meta" id="answer-meta"></div>
    </div>

    <div class="card hidden" id="trace-card">
      <h2>Agent trace</h2>
      <div id="trace"></div>
    </div>
  </section>

  <aside>
    <div class="card">
      <h2>Sources</h2>
      <div id="sources" class="empty">Retrieved passages will be listed here.</div>
    </div>
  </aside>
</main>

<script>
const el = (id) => document.getElementById(id);

const SAMPLES = [
  "What is retrieval augmented generation and why was it introduced?",
  "How many papers were published in 2025, and what are their titles?",
  "Compare what BERT and the original RAG paper say about pre-training."
];

function make(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function addStat(label, value) {
  const chip = make("div", "stat");
  chip.append(label + " ");
  chip.append(make("b", "", String(value)));
  el("stats").append(chip);
}

function percent(value) {
  return value === null || value === undefined ? "-" : Math.round(value * 100) + "%";
}

function currentMode() {
  return document.querySelector("input[name=mode]:checked").value;
}

async function loadStatus() {
  const response = await fetch("/api/status");
  const status = await response.json();
  addStat("papers", status.papers);
  addStat("chunks", status.chunks.toLocaleString());
  const metrics = status.metrics || {};
  if (metrics.retrieval) {
    addStat("recall@5", percent(metrics.retrieval.chunk_recall_at_5));
    addStat("MRR", metrics.retrieval.chunk_mrr.toFixed(2));
  }
  if (metrics.answers) {
    addStat("judged correct", percent(metrics.answers.correct_rate));
  }
  addStat("device", status.device);
}

async function loadPapers() {
  const response = await fetch("/api/papers");
  const payload = await response.json();
  for (const paper of payload.papers) {
    const option = make("option", "", paper.title.slice(0, 80));
    option.value = paper.paper_id;
    el("paper").append(option);
  }
}

function renderAnswer(text, refused) {
  const box = el("answer");
  box.className = refused ? "answer refused" : "answer";
  box.replaceChildren();
  const parts = text.split(/(\[\d+(?:\s*,\s*\d+)*\])/);
  for (const part of parts) {
    if (/^\[\d/.test(part)) {
      const chip = make("span", "cite", part);
      const first = part.match(/\d+/)[0];
      chip.addEventListener("click", () => {
        const target = el("source-" + first);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      box.append(chip);
    } else {
      box.append(part);
    }
  }
}

function renderSources(sources) {
  const box = el("sources");
  box.className = "";
  box.replaceChildren();
  if (!sources.length) {
    box.className = "empty";
    box.textContent = "No passages were retrieved for this question.";
    return;
  }
  for (const source of sources) {
    const item = make("div", source.cited ? "source cited" : "source");
    item.id = "source-" + source.number;
    item.append(make("h3", "", "[" + source.number + "] " + source.paper_title + " (" + source.year + ")"));
    item.append(make("div", "meta", source.section + " · page " + source.pages.join(", ")));
    item.append(make("p", "", source.text));
    box.append(item);
  }
}

function renderTrace(steps) {
  el("trace-card").classList.toggle("hidden", !steps.length);
  const box = el("trace");
  box.replaceChildren();
  for (const step of steps) {
    const item = make("div", "step");
    const head = make("div");
    head.append(make("span", "tool", step.number + ". " + step.tool));
    head.append(" " + step.seconds + "s");
    item.append(head);
    if (step.thought) item.append(make("div", "", step.thought));
    if (Object.keys(step.arguments).length) item.append(make("code", "", JSON.stringify(step.arguments)));
    if (step.observation) item.append(make("code", "", step.observation));
    box.append(item);
  }
}

async function ask() {
  const question = el("question").value.trim();
  if (question.length < 3) return;

  const mode = currentMode();
  el("ask").disabled = true;
  el("progress").textContent = mode === "agent" ? "Agent is working, this can take up to a minute" : "Searching and writing";
  el("answer-meta").textContent = "";

  try {
    const response = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: question,
        mode: mode,
        paper: mode === "quick" ? el("paper").value || null : null,
        year: mode === "quick" ? el("year").value.trim() || null : null
      })
    });
    const payload = await response.json();

    if (!response.ok) {
      const detail = typeof payload.detail === "string" ? payload.detail : "The request was rejected.";
      el("answer").className = "error";
      el("answer").textContent = detail;
      return;
    }

    renderAnswer(payload.answer, payload.refused);
    renderSources(payload.sources);
    renderTrace(payload.steps);

    let meta = payload.mode + " · " + payload.model + " · " + payload.seconds + "s";
    if (payload.invalid_citations.length) {
      meta += " · invalid citations: " + payload.invalid_citations.join(", ");
    }
    el("answer-meta").textContent = meta;
  } catch (error) {
    el("answer").className = "error";
    el("answer").textContent = "The server could not be reached.";
  } finally {
    el("ask").disabled = false;
    el("progress").textContent = "";
  }
}

for (const sample of SAMPLES) {
  const button = make("button", "sample", sample);
  button.addEventListener("click", () => { el("question").value = sample; });
  el("samples").append(button);
}

for (const radio of document.querySelectorAll("input[name=mode]")) {
  radio.addEventListener("change", () => {
    el("filters").classList.toggle("hidden", currentMode() === "agent");
  });
}

el("ask").addEventListener("click", ask);
el("question").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) ask();
});

loadStatus();
loadPapers();
</script>
</body>
</html>
